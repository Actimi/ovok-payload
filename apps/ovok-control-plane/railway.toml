# Railway service config for ovok-control-plane
#
# In the Railway dashboard:
#   Root Directory: . (monorepo root)
#   Config file path: apps/ovok-control-plane/railway.toml

[build]
builder = "DOCKERFILE"
dockerfilePath = "apps/ovok-control-plane/Dockerfile"
watchPatterns = [
  "apps/ovok-control-plane/**",
  "packages/ovok-contracts/**",
  "pnpm-lock.yaml",
  "pnpm-workspace.yaml",
]

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5

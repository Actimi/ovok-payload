name: ovok/ci

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/ovok.yml'
      - 'apps/ovok-cms/**'
      - 'apps/ovok-control-plane/**'
      - 'packages/ovok-contracts/**'
      - 'pnpm-lock.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/ovok.yml'
      - 'apps/ovok-cms/**'
      - 'apps/ovok-control-plane/**'
      - 'packages/ovok-contracts/**'
      - 'pnpm-lock.yaml'

concurrency:
  group: ovok-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DO_NOT_TRACK: 1
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  contracts:
    name: ovok-contracts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          pnpm-run-install: 'true'
      - run: pnpm --filter @ovok/contracts build
      - run: pnpm --filter @ovok/contracts test

  control-plane:
    name: ovok-control-plane
    runs-on: ubuntu-24.04
    needs: contracts
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm --filter @ovok/control-plane build
      - run: pnpm --filter @ovok/control-plane test

  cms:
    name: ovok-cms (unit)
    runs-on: ubuntu-24.04
    needs: contracts
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ovok_cms_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URI: postgres://postgres:postgres@localhost:5432/ovok_cms_test
      PAYLOAD_SECRET: test-secret-with-at-least-32-characters-for-ci
      PAYLOAD_INTERNAL_API_KEY: test-internal-key
      PAYLOAD_DB_PUSH: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      # The contracts job builds on its own runner; this job needs dist/ too.
      - run: pnpm --filter @ovok/contracts build
      - name: Apply migrations (the schema production gets)
        run: pnpm --filter @actimi/ovok-cms payload migrate
      - name: Run tests (integration suites run against the service database)
        run: pnpm --filter @actimi/ovok-cms test:int

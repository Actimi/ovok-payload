name: ovok/ecr

# Build ovok-payload + ovok-control-plane from the monorepo root and push to
# Actimi ECR (eu-central-1).
#
#   staging branch → :staging + :<sha>, then rolls the staging ECS services
#   main    branch → :prod    + :<sha>, prod ECS services are NOT rolled by a push
#
# Rolling prod is a manual step: Actions → ovok/ecr → Run workflow on `main`
# with roll_prod ticked. It rebuilds from main, pushes :prod, then rolls
# ovok-payload and ovok-control-plane in ovok-base-backend-cluster.
#
# A roll is `update-service --force-new-deployment`. The task definitions use the
# mutable :staging / :prod tag, so a push alone never reaches a running task.
# Both services run desiredCount 1 with minimumHealthyPercent 0, so a roll
# stops the old task first: the CMS and control plane are down for a minute or
# two, and ovok-payload runs `payload migrate` at container start.
#
# Required GitHub secret:
#   AWS_ECR_ROLE_ARN — ARN of the IAM role GitHub Actions will assume via OIDC
#                      (ActimiGitHubActionsOIDCRole). Its inline policy
#                      GitHubActionsECSDeployment must allow ecs:UpdateService and
#                      ecs:DescribeServices on the four services rolled below
#                      (infrastructure-as-code: carehub/ecs/modules/ovok-cms/
#                      grant-github-actions-ecs-roll.sh).
#
# ECR repositories (created by terraform):
#   ovok-payload
#   ovok-control-plane

on:
  workflow_dispatch:
    inputs:
      roll_prod:
        description: 'On main: after the push, also roll the PROD ovok-payload and ovok-control-plane services'
        type: boolean
        default: false
  push:
    branches: [staging, main]
    paths:
      - '.github/workflows/ovok-ecr.yml'
      - 'apps/ovok-cms/**'
      - 'apps/ovok-control-plane/**'
      - 'packages/ovok-contracts/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'

concurrency:
  group: ovok-ecr-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: eu-central-1
  AWS_ACCOUNT_ID: '975050321524'

jobs:
  prepare_env:
    name: Prepare ECR environment
    runs-on: ubuntu-24.04
    outputs:
      env: ${{ steps.set_env.outputs.env }}
      registry: ${{ steps.set_env.outputs.registry }}
    steps:
      - name: Set ENV from branch
        id: set_env
        shell: bash
        run: |
          case "${GITHUB_REF#refs/heads/}" in
            staging) ENV=staging ;;
            main)    ENV=prod ;;
            *)
              echo "Only staging and main branches trigger this workflow."
              exit 1
              ;;
          esac
          echo "env=${ENV}" >> "$GITHUB_OUTPUT"
          echo "registry=${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com" >> "$GITHUB_OUTPUT"

  push:
    name: Push ${{ matrix.image }} (${{ needs.prepare_env.outputs.env }})
    needs: prepare_env
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ovok-payload
            dockerfile: apps/ovok-cms/Dockerfile
          - image: ovok-control-plane
            dockerfile: apps/ovok-control-plane/Dockerfile
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ECR_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        # Pinned to v2.0.1 — same pin as ovok-core (floating v2 moved to node24).
        uses: aws-actions/amazon-ecr-login@v2.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push ${{ matrix.image }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: |
            ${{ needs.prepare_env.outputs.registry }}/${{ matrix.image }}:${{ needs.prepare_env.outputs.env }}
            ${{ needs.prepare_env.outputs.registry }}/${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}-${{ needs.prepare_env.outputs.env }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ needs.prepare_env.outputs.env }}

  deploy:
    name: Roll ECS services (${{ needs.prepare_env.outputs.env }})
    needs: [prepare_env, push]
    # staging rolls on every push; prod only from a manual run with roll_prod ticked.
    if: >-
      needs.prepare_env.outputs.env == 'staging' ||
      (github.event_name == 'workflow_dispatch' && inputs.roll_prod)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      id-token: write
      contents: read
    env:
      ENV: ${{ needs.prepare_env.outputs.env }}
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ECR_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Force new deployment, then wait for the new rollout
        shell: bash
        run: |
          set -euo pipefail
          case "$ENV" in
            staging) CLUSTER=ovok-staging-backend-cluster ;;
            prod)    CLUSTER=ovok-base-backend-cluster ;;
            *) echo "::error::unexpected env '$ENV'"; exit 1 ;;
          esac

          SERVICES=(ovok-payload ovok-control-plane)
          declare -A DEPLOYMENT

          for svc in "${SERVICES[@]}"; do
            DEPLOYMENT[$svc]=$(aws ecs update-service \
              --cluster "$CLUSTER" --service "$svc" --force-new-deployment \
              --query 'service.deployments[?status==`PRIMARY`] | [0].id' --output text)
            echo "$svc ($CLUSTER): started ${DEPLOYMENT[$svc]}"
          done

          # Wait for each NEW deployment only. Never wait for the old one to drain
          # (the services-stable waiter can sit for a long time on a slow drain).
          # The circuit breaker marks a bad rollout FAILED and rolls it back.
          pending=("${SERVICES[@]}")
          deadline=$((SECONDS + 1200))
          while [ "${#pending[@]}" -gt 0 ]; do
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::rollout not COMPLETED after 20 min: ${pending[*]}"
              exit 1
            fi
            sleep 15
            next=()
            for svc in "${pending[@]}"; do
              state=$(aws ecs describe-services --cluster "$CLUSTER" --services "$svc" \
                --query "services[0].deployments[?id=='${DEPLOYMENT[$svc]}'] | [0].rolloutState" \
                --output text)
              case "$state" in
                COMPLETED) echo "$svc: rollout COMPLETED" ;;
                FAILED)
                  echo "::error::$svc rollout FAILED (circuit breaker rolls back)"
                  exit 1
                  ;;
                *) next+=("$svc") ;;
              esac
            done
            pending=("${next[@]}")
          done
